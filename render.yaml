services:
  - type: web
    name: fullstack-app
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        value: "" # Laissez vide ou configurez votre URI de connexion MongoDB dans Render
